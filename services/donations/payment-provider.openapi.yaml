openapi: 3.0.3
info:
  title: QARoom Payment Provider (mock)
  version: 1.0.0
  description: >-
    The external payment provider donations-service settles through. This spec is NOT generated
    from Zod — it is the EXTERNAL contract, served as a mock by Microcks (Milestone 5).
    donations-service treats any non-2xx as a provider fault (502 dependency_failure).

    NOTHING currently verifies donations-service's expectations against this spec. An earlier
    version of this description claimed a Pact consumer contract in tests/contracts/ did; there is
    no such contract — the only Pact artifacts are gateway->service, and tests/contracts/ here
    holds provider.verify.ts (donations AS a provider). What IS gated: scripts/microcks-verify.test.ts
    keeps this file and the deploy/observability/microcks.yaml ConfigMap copy in step and pins the
    mock URL to info.title/info.version, and scripts/smoke.sh probes the live mock.
servers:
  # Microcks builds this path from info.title + info.version. Parens stay LITERAL: percent-encoding
  # them 404s every charge (measured against microcks-uber 1.11.0). Pinned by
  # scripts/microcks-verify.test.ts against deploy/donations/values.yaml.
  - url: http://qaroom-microcks.observability.svc.cluster.local:8080/rest/QARoom%20Payment%20Provider%20(mock)/1.0.0
    description: Microcks mock endpoint, in-cluster
paths:
  /charges:
    post:
      operationId: createCharge
      summary: Charge a donation
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Makes the charge safely retryable at the provider.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeRequest'
            examples:
              captured:
                value:
                  amount_cents: 2500
                  currency: USD
      responses:
        '200':
          description: The charge outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
              examples:
                captured:
                  value:
                    id: pay_01HZY0K7M3QF8VN2J5RX9TB4CM
                    status: captured
components:
  schemas:
    ChargeRequest:
      type: object
      additionalProperties: false
      required: [amount_cents, currency]
      properties:
        amount_cents:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    Charge:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [captured, declined]
